name: Test groups

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-validation:
    name: Web · ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - content
          - harmony
          - guitar3d:math
          - guitar3d:assets
          - library-search
          - song-library
          - song-builder
          - right-hand-learning
          - right-hand-audio
          - localization
          - types
          - runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web:${{ matrix.group }}

  web-build-performance:
    name: Web · production build and performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web:build-performance

  android-unit:
    name: Android · JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"
      - run: npm run test:android:unit

  android-instrumented:
    name: Android · instrumented acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run test:android:instrumented

  ios-unit:
    name: iOS · unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:ios:unit

  ios-ui:
    name: iOS · UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:ios:ui

  quality-gate:
    name: All test groups passed
    if: always()
    needs:
      - web-validation
      - web-build-performance
      - android-unit
      - android-instrumented
      - ios-unit
      - ios-ui
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group
        env:
          WEB_VALIDATION: ${{ needs.web-validation.result }}
          WEB_BUILD: ${{ needs.web-build-performance.result }}
          ANDROID_UNIT: ${{ needs.android-unit.result }}
          ANDROID_INSTRUMENTED: ${{ needs.android-instrumented.result }}
          IOS_UNIT: ${{ needs.ios-unit.result }}
          IOS_UI: ${{ needs.ios-ui.result }}
        run: |
          test "$WEB_VALIDATION" = success
          test "$WEB_BUILD" = success
          test "$ANDROID_UNIT" = success
          test "$ANDROID_INSTRUMENTED" = success
          test "$IOS_UNIT" = success
          test "$IOS_UI" = success
